<svg xmlns="http://www.w3.org/2000/svg" width="160" height="140" viewBox="0 0 160 140" role="img" aria-label="Running bot">
  <!-- speed lines -->
  <g stroke="#3fb950" stroke-width="3" stroke-linecap="round">
    <line x1="12" y1="58" x2="40" y2="58" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="6" y1="76" x2="34" y2="76" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="16" y1="94" x2="42" y2="94" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <!-- body bounce -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="80" y1="34" x2="80" y2="20" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="17" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="62" y="34" width="36" height="26" rx="8" fill="#3fb950"/>
    <circle cx="74" cy="47" r="4.5" fill="#0d1117"/>
    <circle cx="88" cy="47" r="4.5" fill="#0d1117"/>

    <!-- body -->
    <rect x="60" y="64" width="40" height="32" rx="8" fill="#3fb950"/>
    <rect x="71" y="72" width="18" height="7" rx="3.5" fill="#0d1117" opacity="0.35"/>

    <!-- arms -->
    <rect x="52" y="66" width="8" height="22" rx="4" fill="#3fb950">
      <animateTransform attributeName="transform" type="rotate" values="-22 56 68; 22 56 68; -22 56 68" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="66" width="8" height="22" rx="4" fill="#3fb950">
      <animateTransform attributeName="transform" type="rotate" values="22 104 68; -22 104 68; 22 104 68" dur="0.5s" repeatCount="indefinite"/>
    </rect>

    <!-- legs -->
    <rect x="64" y="96" width="10" height="26" rx="5" fill="#3fb950">
      <animateTransform attributeName="transform" type="rotate" values="30 69 96; -30 69 96; 30 69 96" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="86" y="96" width="10" height="26" rx="5" fill="#3fb950">
      <animateTransform attributeName="transform" type="rotate" values="-30 91 96; 30 91 96; -30 91 96" dur="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
