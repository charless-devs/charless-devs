<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CHARLES — Library Animated GitHub Banner (1280×640)</title>
<!--
  ============================================================
  CHARLES — "University Library" Animated GitHub Profile Banner
  (1280 x 640)
  ------------------------------------------------------------
  FIXES:
  • Removed the prefers-reduced-motion kill-switch — animations
    now ALWAYS run (previously, if Windows had "Animation
    effects" turned off, every animation was disabled).
  • Icon labels now sit on white pills (readable over books).
  • Rebalanced layout: no more label/desk/edge collisions.
  ------------------------------------------------------------
  HOW TO USE:
  1. Open in Chrome/Edge → press F (or click) to fullscreen.
  2. Record ~10s with Win+G / OBS, or screenshot it.
  3. Convert to GIF (ezgif.com or ffmpeg) → banner.gif
  ============================================================
-->
<style>
  :root{
    --green:  #10b981;
    --cream:  #f6efe1;
    --wall-1: #f8f1e3;
    --wall-2: #e9dcc4;
    --walnut: #7c4a24;
    --walnut-d:#5d3a1c;
    --ink:    #231a12;
    --amber:  #f3c97a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#160f08;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Segoe UI", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    gap:14px;
  }

  /* ============ STAGE ============ */
  .stage{
    position:relative;
    width:1280px; height:640px;
    overflow:hidden;
    background:var(--cream);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    cursor:pointer;
  }
  .camera{
    position:absolute; inset:0;
    transform-origin:center;
    animation:pan 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes pan{
    0%   { transform:translateX(-15px) translateY(-5px) scale(1.035); }
    100% { transform:translateX(15px)  translateY(5px)  scale(1.055); }
  }

  /* ============ LIBRARY ROOM ============ */
  .wall{
    position:absolute; left:-120px; top:-120px; width:1520px; height:575px;
    background:
      radial-gradient(700px 340px at 50% 6%, rgba(255,244,220,.95), transparent 70%),
      linear-gradient(180deg, var(--wall-1) 0%, var(--wall-2) 100%);
  }
  .floor{
    position:absolute; left:-120px; top:454px; width:1520px; height:320px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 3px, transparent 3px 64px),
      linear-gradient(180deg,#c9a271,#a67c4c);
  }
  /* warm light beam from high window */
  .warmbeam{
    position:absolute; left:120px; top:-140px; width:620px; height:640px;
    background:linear-gradient(118deg, rgba(255,226,160,.75), rgba(255,226,160,0) 60%);
    transform:rotate(6deg);
    filter:blur(8px);
    animation:beam 9s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes beam{ from{opacity:.45} to{opacity:.9} }
  /* accent lighting: brand green + lamp amber */
  .glow-green{
    position:absolute; right:-90px; bottom:-60px; width:460px; height:340px;
    background:radial-gradient(closest-side, rgba(16,185,129,.30), transparent 75%);
    animation:breathe 7s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .glow-amber{
    position:absolute; left:-120px; top:60px; width:520px; height:420px;
    background:radial-gradient(closest-side, rgba(243,201,122,.42), transparent 75%);
    animation:breathe 9s ease-in-out infinite alternate-reverse;
    pointer-events:none;
  }
  @keyframes breathe{ from{opacity:.55} to{opacity:1} }
  /* floating dust motes */
  .dot{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,244,214,.95), rgba(255,226,160,.15));
    box-shadow:0 0 12px rgba(255,235,190,.9);
    animation:drift 11s ease-in-out infinite alternate;
    opacity:.75;
    pointer-events:none;
  }
  @keyframes drift{ from{transform:translate(0,0)} to{transform:translate(16px,-26px)} }

  /* ============ BOOKSHELVES ============ */
  .shelf{
    position:absolute; top:-14px; height:446px; width:312px;
    background:linear-gradient(90deg,#6b3f1e,#8a5527 25%,#7c4a24 60%,#5d3718);
    border-radius:8px;
    box-shadow:inset 0 0 46px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.30);
    padding:16px 16px 10px;
    z-index:2;
  }
  .shelf.l{ left:-18px; }
  .shelf.r{ right:-18px; width:318px; }
  .shelf::before{ /* crown molding */
    content:""; position:absolute; left:-8px; right:-8px; top:-8px; height:14px;
    background:linear-gradient(180deg,#a9713a,#6d401d);
    border-radius:5px 5px 0 0;
    box-shadow:0 5px 10px rgba(0,0,0,.35);
  }
  .shelf .lvl{
    position:relative; height:92px; margin-bottom:22px;
    background-image: var(--gaps), var(--books);
    background-repeat: repeat, repeat-x;
    box-shadow:inset 0 -20px 24px -12px rgba(0,0,0,.6), inset 0 12px 18px -10px rgba(0,0,0,.5);
    border-radius:2px;
  }
  .shelf .lvl::after{ /* shelf board */
    content:""; position:absolute; left:-12px; right:-12px; bottom:-15px; height:13px;
    background:linear-gradient(180deg,#b57b41,#75461f);
    border-radius:2px;
    box-shadow:0 6px 12px rgba(0,0,0,.45);
  }
  .shelf .lvl i{ /* leaning book */
    position:absolute; bottom:0; width:14px; border-radius:2px 2px 0 0;
    box-shadow:2px 0 5px rgba(0,0,0,.35);
    transform-origin:bottom center;
  }
  .books-a{
    --books: repeating-linear-gradient(90deg,
      #b4533f 0 17px, #d99a4e 17px 31px, #6f8552 31px 44px,
      #4f74a0 44px 60px, #9b6a93 60px 74px, #c8a24b 74px 86px,
      #a04a5b 86px 101px, #4d8577 101px 116px);
    --gaps: repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 17px);
  }
  .books-b{
    --books: repeating-linear-gradient(90deg,
      #3f6f9b 0 14px, #a5563f 14px 30px, #caa94e 30px 41px,
      #6a5b8f 41px 57px, #4d8577 57px 71px, #b9734a 71px 88px,
      #8f4f6d 88px 102px, #5d7ea8 102px 118px);
    --gaps: repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 14px);
  }
  .books-c{
    --books: repeating-linear-gradient(90deg,
      #7a8f55 0 18px, #b4533f 18px 32px, #4f74a0 32px 47px,
      #d99a4e 47px 59px, #8f4f6d 59px 73px, #4d8577 73px 87px,
      #c8a24b 87px 100px, #6a5b8f 100px 114px);
    --gaps: repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 18px);
  }

  /* ============ DESK ============ */
  .desk-top{
    position:absolute; left:-120px; top:430px; width:1520px; height:26px;
    background:linear-gradient(180deg,#b0783f 0%,#8a5a2e 35%,#6f451f 100%);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    z-index:3;
  }
  .desk-top::after{
    content:""; position:absolute; left:0; top:0; width:100%; height:5px;
    background:linear-gradient(180deg, rgba(255,236,200,.55), transparent);
  }
  .desk-edge{
    position:absolute; left:-120px; top:456px; width:1520px; height:10px;
    background:linear-gradient(180deg,#5b3819,#402610);
    z-index:3;
  }
  .leg{
    position:absolute; top:462px; width:28px; height:180px;
    background:linear-gradient(90deg,#6b4220,#8a5a2e,#553318);
    box-shadow:0 12px 26px rgba(0,0,0,.4);
    z-index:3;
  }
  .leg.l{ left:118px; } .leg.r{ left:1132px; }
  .under-desk{
    position:absolute; left:-120px; top:462px; width:1520px; height:210px;
    background:linear-gradient(180deg, rgba(40,24,10,.34), rgba(40,24,10,0) 72%);
    pointer-events:none;
    z-index:3;
  }

  /* ============ TITLE ============ */
  .title{
    position:absolute; left:0; right:0; top:52px;
    text-align:center;
    z-index:6;
    pointer-events:none;
  }
  .name{
    font-size:92px; font-weight:800; letter-spacing:.10em;
    color:var(--ink);
    -webkit-text-stroke:1px rgba(5,150,105,.5);
    text-shadow:
      0 0 2px rgba(16,185,129,.9),
      0 0 24px rgba(34,197,94,.55),
      0 0 64px rgba(16,185,129,.30);
    animation:titleGlow 4.5s ease-in-out infinite alternate;
  }
  @keyframes titleGlow{
    from{ text-shadow:0 0 2px rgba(16,185,129,.8), 0 0 20px rgba(34,197,94,.45), 0 0 54px rgba(16,185,129,.25); }
    to  { text-shadow:0 0 3px rgba(16,185,129,1),   0 0 34px rgba(34,197,94,.75), 0 0 84px rgba(16,185,129,.45); }
  }
  .subtitle{
    margin-top:12px;
    font-size:25px; font-weight:600; letter-spacing:.06em;
    color:#5b5148;
    white-space:nowrap;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .subtitle .typed{ color:#0f766e; }
  .caret{
    display:inline-block; width:3px; height:1.05em;
    background:var(--green);
    margin-left:4px; vertical-align:-0.15em;
    box-shadow:0 0 10px rgba(16,185,129,.9);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{opacity:0} }

  /* ============ FLOATING TECH ICONS ============ */
  .icon{
    position:absolute; width:80px; text-align:center; z-index:5;
    animation:bob 5.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 12px rgba(40,24,10,.30));
  }
  .icon svg{ width:62px; height:62px; opacity:.95; }
  .icon .label{
    display:inline-block; margin-top:3px;
    font-size:11px; font-weight:700; letter-spacing:.05em;
    color:#3d332a;
    background:rgba(255,255,255,.90);
    border:1px solid rgba(255,255,255,.95);
    padding:1px 8px; border-radius:9px;
    box-shadow:0 3px 8px rgba(40,24,10,.22);
  }
  @keyframes bob{
    0%,100%{ transform:translateY(-9px) rotate(-1.5deg); }
    50%    { transform:translateY(9px)  rotate(1.5deg);  }
  }

  /* ============ GLASS PANELS (over the right shelf) ============ */
  .panel{
    position:absolute; left:988px; width:242px; height:78px;
    padding:13px 18px;
    display:flex; align-items:center; gap:13px;
    background:rgba(255,250,240,.55);
    border:1px solid rgba(255,255,255,.85);
    border-radius:18px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 14px 36px rgba(40,24,10,.28), inset 0 1px 0 rgba(255,255,255,.95);
    overflow:hidden;
    z-index:5;
    animation:panelFloat 7s ease-in-out infinite;
  }
  .panel::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.7) 46%, transparent 60%);
    transform:translateX(-130%);
    animation:shimmer 6s ease-in-out infinite;
  }
  .panel.p1{ top:112px; }
  .panel.p2{ top:206px; animation-delay:-3.2s; }
  @keyframes panelFloat{ 0%,100%{transform:translateY(-5px)} 50%{transform:translateY(5px)} }
  @keyframes shimmer{ 0%,55%{transform:translateX(-130%)} 85%,100%{transform:translateX(130%)} }
  .panel .plogo{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:17px;
    box-shadow:0 4px 12px rgba(40,24,10,.35);
  }
  .panel .ptxt strong{ display:block; font-size:20px; color:var(--ink); }
  .panel .ptxt span{ font-size:12.5px; color:#7a6f63; letter-spacing:.05em; }

  /* ============ LAPTOP ============ */
  .laptop{ position:absolute; left:470px; top:215px; width:330px; z-index:4; }
  .screen{
    width:330px; height:200px;
    background:#0b1220;
    border:9px solid #1e293b;
    border-bottom-width:12px;
    border-radius:12px 12px 4px 4px;
    box-shadow:0 16px 36px rgba(40,24,10,.45), 0 0 44px rgba(59,130,246,.14);
    padding:8px 10px;
    position:relative; overflow:hidden;
  }
  .screen::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,.14) 0%, transparent 42%);
    pointer-events:none;
  }
  .tabbar{ display:flex; gap:6px; margin-bottom:7px; }
  .tabbar i{ width:9px; height:9px; border-radius:50%; display:block; }
  .code{ display:flex; flex-direction:column; gap:6px; }
  .code .row{ display:flex; gap:5px; align-items:center; }
  .code b{ display:block; height:7px; border-radius:3px; font-weight:400; }
  .cursor-line{
    display:inline-block; width:8px; height:13px;
    background:var(--green); margin-left:3px;
    box-shadow:0 0 9px rgba(16,185,129,.9);
    animation:blink 1.05s step-end infinite;
  }
  .base{
    position:absolute; left:-25px; top:200px;
    width:380px; height:16px;
    background:linear-gradient(180deg,#334155,#1e293b);
    clip-path:polygon(6% 0, 94% 0, 100% 100%, 0 100%);
    border-radius:0 0 10px 10px;
    box-shadow:0 8px 16px rgba(40,24,10,.5);
  }
  .base::after{
    content:""; position:absolute; left:50%; top:0; width:70px; height:5px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.18); border-radius:0 0 6px 6px;
  }

  /* ============ ARDUINO ============ */
  .arduino{
    position:absolute; left:158px; top:352px; width:152px; height:78px;
    background:linear-gradient(160deg,#0aa1b4,#077f95 60%,#066a7d);
    border-radius:7px;
    box-shadow:0 12px 26px rgba(40,24,10,.45), inset 0 1px 0 rgba(255,255,255,.35);
    z-index:4;
  }
  .arduino .usb{
    position:absolute; left:-10px; top:16px; width:34px; height:26px;
    background:linear-gradient(180deg,#e2e8f0,#94a3b8);
    border-radius:4px; box-shadow:inset 0 0 0 2px #cbd5e1;
  }
  .arduino .jack{
    position:absolute; left:-9px; top:50px; width:26px; height:24px;
    background:#111827; border-radius:4px;
  }
  .arduino .chip{
    position:absolute; left:56px; top:34px; width:34px; height:26px;
    background:#0f172a; border-radius:4px;
    box-shadow:inset 0 0 0 1px #334155;
  }
  .arduino .pins{
    position:absolute; left:34px; top:-5px; width:112px; height:9px;
    background:repeating-linear-gradient(90deg,#111827 0 7px, #f8fafc 7px 12px);
    border-radius:2px;
  }
  .arduino .word{
    position:absolute; left:14px; top:58px;
    font-size:9px; font-weight:700; letter-spacing:.14em;
    color:rgba(255,255,255,.85);
  }
  .leds{ position:absolute; left:58px; top:10px; display:flex; gap:9px; }
  .leds i{
    width:9px; height:9px; border-radius:50%; display:block;
    background:#1f2937; opacity:.35;
    animation:led 1.5s step-end infinite;
  }
  .leds i.on-green { --c:#22c55e; }
  .leds i.on-amber { --c:#f59e0b; }
  .leds i.on-red   { --c:#ef4444; }
  .leds i:nth-child(1){ animation-delay:0s; }
  .leds i:nth-child(2){ animation-delay:.25s; }
  .leds i:nth-child(3){ animation-delay:.5s; }
  .leds i:nth-child(4){ animation-delay:.75s; }
  .leds i:nth-child(5){ animation-delay:1s; }
  .leds i:nth-child(6){ animation-delay:1.25s; }
  @keyframes led{
    0%,25%   { background:var(--c); opacity:1; box-shadow:0 0 12px var(--c),0 0 4px var(--c); }
    26%,100% { background:#1f2937; opacity:.35; box-shadow:none; }
  }

  /* ============ TABLET — QuizNova UI ============ */
  .tablet{
    position:absolute; left:872px; top:306px; width:172px; height:124px;
    background:#0f172a; border-radius:12px;
    padding:7px;
    transform:rotate(-6deg);
    box-shadow:0 14px 30px rgba(40,24,10,.45);
    z-index:4;
  }
  .tablet .ui{
    width:100%; height:100%; border-radius:7px; overflow:hidden;
    background:linear-gradient(150deg,#eef2ff,#ffffff 45%);
    position:relative;
  }
  .ui .nav{
    height:24px; background:linear-gradient(90deg,#6366f1,#8b5cf6);
    display:flex; align-items:center; padding:0 8px; gap:6px;
  }
  .ui .nav b{ color:#fff; font-size:11.5px; letter-spacing:.04em; }
  .ui .nav .n-dot{ width:8px; height:8px; border-radius:50%; background:#a5b4fc; }
  .ui .body{ padding:7px 9px; }
  .ui .q{ font-size:10px; font-weight:700; color:#1e293b; margin-bottom:6px; }
  .ui .opt{
    height:11px; border-radius:5px; background:#e2e8f0; margin-bottom:5px;
    position:relative; overflow:hidden;
  }
  .ui .opt.right{ background:#d1fae5; box-shadow:inset 0 0 0 1.5px #10b981; }
  .ui .opt.right::after{
    content:"✓"; position:absolute; right:5px; top:-4px;
    font-size:10px; color:#059669; font-weight:800;
  }
  .ui .bar{
    height:7px; border-radius:4px; background:#e2e8f0; overflow:hidden; margin-top:7px;
  }
  .ui .bar i{
    display:block; width:100%; height:100%;
    background:linear-gradient(90deg,#6366f1,#22d3ee);
    border-radius:4px;
    transform:scaleX(.72); transform-origin:left center;
    animation:progress 5s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes progress{ from{transform:scaleX(.55)} to{transform:scaleX(.9)} }

  /* ============ DESK PROPS: book stack, lamp, coffee ============ */
  .book-stack{ position:absolute; left:40px; top:374px; width:118px; height:56px; z-index:4; }
  .book-stack b{
    position:absolute; height:15px; border-radius:3px; display:block;
    box-shadow:0 4px 8px rgba(40,24,10,.45);
    background:linear-gradient(180deg, var(--c) 0 62%, #f3ead6 62% 88%, var(--c) 88%);
  }
  .book-stack b:nth-child(1){ left:2px;  top:0;  width:106px; --c:#b4533f; transform:rotate(-2deg); }
  .book-stack b:nth-child(2){ left:0;  top:18px; width:116px; --c:#3f6f9b; }
  .book-stack b:nth-child(3){ left:6px; top:36px; width:100px; --c:#6f8552; transform:rotate(1.5deg); }

  .lamp{ position:absolute; left:1130px; top:300px; width:100px; height:130px; z-index:4; }
  .lamp .base{
    position:absolute; bottom:0; left:12px; width:76px; height:12px; border-radius:7px;
    background:linear-gradient(180deg,#a9834b,#5c4426);
    box-shadow:0 5px 10px rgba(40,24,10,.5);
  }
  .lamp .arm{
    position:absolute; bottom:9px; left:46px; width:8px; height:84px;
    background:linear-gradient(90deg,#b9904f,#6b4f2a);
    border-radius:4px;
    transform:rotate(13deg); transform-origin:bottom center;
  }
  .lamp .head{
    position:absolute; top:2px; left:24px; width:58px; height:34px;
    border-radius:30px 30px 10px 10px;
    background:linear-gradient(180deg,#3f8a66,#235741);
    box-shadow:inset 0 -7px 9px rgba(0,0,0,.35), 0 6px 14px rgba(40,24,10,.4);
    transform:rotate(-8deg);
  }
  .lamp .bulb{
    position:absolute; top:30px; left:44px; width:14px; height:9px; border-radius:50%;
    background:#ffe6ae;
    box-shadow:0 0 14px rgba(255,214,140,.95);
    transform:rotate(-8deg);
  }
  .lamp .glow{
    position:absolute; top:26px; left:2px; width:96px; height:96px;
    background:radial-gradient(closest-side, rgba(255,214,140,.85), rgba(255,214,140,0) 75%);
    animation:lampGlow 4s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes lampGlow{ from{opacity:.55; transform:scale(.94)} to{opacity:1; transform:scale(1.05)} }

  .coffee{ position:absolute; left:394px; top:394px; width:54px; height:40px; z-index:4; }
  .coffee .cup{
    position:absolute; bottom:0; left:2px; width:40px; height:30px;
    border-radius:5px 5px 12px 12px;
    background:linear-gradient(180deg,#fdf8ef,#e4d8c1);
    box-shadow:0 7px 13px rgba(40,24,10,.4), inset 0 2px 0 #fff;
  }
  .coffee .cup::before{
    content:""; position:absolute; left:4px; right:4px; top:4px; height:7px;
    border-radius:5px; background:#4a2f1b;
  }
  .coffee .cup::after{
    content:""; position:absolute; right:-11px; top:8px; width:13px; height:14px;
    border:3px solid #e4d8c1; border-left:none;
    border-radius:0 9px 9px 0;
  }
  .coffee .steam{
    position:absolute; top:-2px; left:12px; width:22px; height:24px;
    pointer-events:none;
  }
  .coffee .steam i{
    position:absolute; bottom:0; width:3.5px; height:17px; border-radius:3px;
    background:rgba(255,255,255,.85);
    animation:steam 3s ease-in-out infinite;
  }
  .coffee .steam i:nth-child(1){ left:4px; }
  .coffee .steam i:nth-child(2){ left:13px; animation-delay:-1.5s; }
  @keyframes steam{
    0%   { transform:translateY(4px) scaleY(.7); opacity:0; }
    35%  { opacity:.9; }
    100% { transform:translateY(-14px) scaleY(1.15); opacity:0; }
  }

  /* ============ ASTRONAUT ============ */
  .astro-wrap{
    position:absolute; left:566px; top:470px; width:190px; height:140px;
    z-index:5;
    animation:floaty 6.5s ease-in-out infinite;
  }

<script>
  /* ---- capture mode (headless GIF export) ---- */
  if (location.hash.includes("capture") || new URLSearchParams(location.search).has("capture"))
    document.body.classList.add("capture");

  /* ---- typing subtitle (always animates — no reduced-motion check) ---- */
  const text = "BSIT Student & Full-Stack Developer";
  const el = document.getElementById("typed");
  let i = 0, deleting = false;
  (function tick(){
    if (!deleting) {
      el.textContent = text.slice(0, ++i);
      if (i === text.length) { deleting = true; return setTimeout(tick, 2600); }
      setTimeout(tick, 55 + Math.random() * 45);
    } else {
      el.textContent = text.slice(0, --i);
      if (i === 0) { deleting = false; return setTimeout(tick, 700); }
      setTimeout(tick, 24);
    }
  })();

  /* ---- fullscreen for clean recording ---- */
  const stage = document.getElementById("stage");
  stage.addEventListener("click", () => {
    if (!document.fullscreenElement) stage.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  document.addEventListener("keydown", e => {
    if (e.key && e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) stage.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });
</script>
