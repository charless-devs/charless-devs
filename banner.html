<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CHARLES — Animated GitHub Banner (1280×640)</title>
<!--
  ============================================================
  CHARLES — Animated GitHub Profile Banner  (1280 x 640)
  ============================================================
  HOW TO USE:
  1. Open this file in Chrome/Edge.
  2. Press "F" (or click the banner) to enter fullscreen.
  3. Record the banner area with Xbox Game Bar (Win+G), OBS,
     or any screen recorder for ~10 seconds.
  4. Convert the recording to GIF:
       ffmpeg -i recording.mp4 -vf "fps=24,scale=1280:-1:flags=lanczos" banner.gif
     ...or upload to https://ezgif.com/video-to-gif and trim.
  5. Upload banner.gif to your GitHub repo and add to your README:
       ![CHARLES Banner](banner.gif)
  ============================================================
-->
<style>
  :root{
    --green: #10b981;
    --blue:  #3b82f6;
    --ink:   #0f172a;
    --wood-1:#e6b17c;
    --wood-2:#c98a4f;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#0b1220;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Segoe UI", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    gap:14px;
  }
  /* ============ STAGE ============ */
  .stage{
    position:relative;
    width:1280px; height:640px;
    overflow:hidden;
    background:#eaf1f9;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    cursor:pointer;
  }
  .camera{
    position:absolute; inset:0;
    transform-origin:center;
    animation:pan 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes pan{
    0%   { transform:translateX(-16px) translateY(-6px) scale(1.035); }
    100% { transform:translateX(16px)  translateY(6px)  scale(1.055); }
  }

  /* ============ ROOM ============ */
  .wall{
    position:absolute; left:-120px; top:-120px; width:1520px; height:570px;
    background:
      radial-gradient(600px 300px at 20% 10%, rgba(255,255,255,.9), transparent 70%),
      linear-gradient(165deg,#f8fbff 0%,#e7eef8 55%,#dde7f4 100%);
  }
  .floor{
    position:absolute; left:-120px; top:454px; width:1520px; height:320px;
    background:linear-gradient(180deg,#d7e0ec,#c3cfe1);
  }
  /* soft daylight window */
  .window{
    position:absolute; left:46px; top:44px; width:252px; height:292px;
    background:linear-gradient(170deg,#ffffff 0%,#eaf6ff 45%,#c9e4ff 100%);
    border:9px solid #fbfdff;
    border-radius:6px;
    box-shadow:0 0 60px rgba(255,255,255,.95), 0 12px 30px rgba(15,23,42,.10);
    overflow:hidden;
  }
  .window::before,.window::after{
    content:""; position:absolute; background:#fbfdff;
    box-shadow:0 0 6px rgba(15,23,42,.06);
  }
  .window::before{ left:50%; top:0; width:8px; height:100%; transform:translateX(-50%); }
  .window::after { top:50%; left:0; height:8px; width:100%; transform:translateY(-50%); }
  .sunbeam{
    position:absolute; left:180px; top:-60px; width:560px; height:520px;
    background:linear-gradient(120deg, rgba(255,255,255,.85), rgba(255,255,255,0) 62%);
    transform:rotate(8deg);
    filter:blur(6px);
    animation:sun 9s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes sun{ from{opacity:.55} to{opacity:.95} }
  /* accent lighting */
  .glow-green{
    position:absolute; right:-80px; bottom:-40px; width:520px; height:380px;
    background:radial-gradient(closest-side, rgba(16,185,129,.38), transparent 75%);
    animation:breathe 7s ease-in-out infinite alternate;
  }
  .glow-blue{
    position:absolute; left:-140px; top:120px; width:560px; height:440px;
    background:radial-gradient(closest-side, rgba(59,130,246,.30), transparent 75%);
    animation:breathe 9s ease-in-out infinite alternate-reverse;
  }
  @keyframes breathe{ from{opacity:.55} to{opacity:1} }
  /* floating bokeh particles */
  .dot{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.15));
    box-shadow:0 0 14px rgba(255,255,255,.8);
    animation:drift 11s ease-in-out infinite alternate;
    opacity:.7;
  }
  @keyframes drift{ from{transform:translate(0,0)} to{transform:translate(18px,-26px)} }

  /* ============ DESK ============ */
  .desk-top{
    position:absolute; left:-120px; top:430px; width:1520px; height:26px;
    background:linear-gradient(180deg,#f3caa0 0%,var(--wood-1) 30%,var(--wood-2) 100%);
    box-shadow:0 8px 22px rgba(15,23,42,.28);
  }
  .desk-top::after{
    content:""; position:absolute; left:0; top:0; width:100%; height:5px;
    background:linear-gradient(180deg, rgba(255,255,255,.75), transparent);
  }
  .desk-edge{
    position:absolute; left:-120px; top:456px; width:1520px; height:9px;
    background:linear-gradient(180deg,#9c6435,#7d4e27);
  }
  .leg{
    position:absolute; top:462px; width:26px; height:180px;
    background:linear-gradient(90deg,#8a5a2e,#b47a44,#754822);
    box-shadow:0 10px 24px rgba(15,23,42,.30);
  }
  .leg.l{ left:118px; } .leg.r{ left:1132px; }
  .under-desk{
    position:absolute; left:-120px; top:462px; width:1520px; height:200px;
    background:linear-gradient(180deg, rgba(15,23,42,.22), rgba(15,23,42,0) 75%);
    pointer-events:none;
  }

  /* ============ TITLE ============ */
  .title{
    position:absolute; left:0; right:0; top:56px;
    text-align:center;
    z-index:6;
    pointer-events:none;
  }
  .name{
    font-size:92px; font-weight:800; letter-spacing:.10em;
    color:#0b1b13;
    -webkit-text-stroke:1px rgba(5,150,105,.55);
    text-shadow:
      0 0 2px rgba(16,185,129,.9),
      0 0 24px rgba(34,197,94,.55),
      0 0 64px rgba(16,185,129,.35);
    animation:titleGlow 4.5s ease-in-out infinite alternate;
  }
  @keyframes titleGlow{
    from{ text-shadow:0 0 2px rgba(16,185,129,.8), 0 0 20px rgba(34,197,94,.45), 0 0 54px rgba(16,185,129,.28); }
    to  { text-shadow:0 0 3px rgba(16,185,129,1),   0 0 34px rgba(34,197,94,.75), 0 0 84px rgba(16,185,129,.5); }
  }
  .subtitle{
    margin-top:12px;
    font-size:25px; font-weight:600; letter-spacing:.06em;
    color:#334155;
    white-space:nowrap;
  }
  .subtitle .typed{ color:#0e7490; }
  .caret{
    display:inline-block; width:3px; height:1.05em;
    background:var(--green);
    margin-left:4px; vertical-align:-0.15em;
    box-shadow:0 0 10px rgba(16,185,129,.9);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{opacity:0} }

  /* ============ FLOATING TECH ICONS ============ */
  .icon{
    position:absolute; width:74px; text-align:center; z-index:5;
    animation:bob 5.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 14px rgba(15,23,42,.22));
  }
  .icon svg{ width:64px; height:64px; opacity:.9; }
  .icon .label{
    display:block; margin-top:2px;
    font-size:11px; font-weight:600; letter-spacing:.05em;
    color:rgba(15,23,42,.62);
    text-shadow:0 1px 2px rgba(255,255,255,.8);
  }
  @keyframes bob{
    0%,100%{ transform:translateY(-9px) rotate(-1.5deg); }
    50%    { transform:translateY(9px)  rotate(1.5deg);  }
  }

  /* ============ GLASS PANELS ============ */
  .panel{
    position:absolute; left:990px; width:238px; height:78px;
    padding:13px 18px;
    display:flex; align-items:center; gap:13px;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.8);
    border-radius:18px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 34px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.9);
    overflow:hidden;
    z-index:5;
    animation:panelFloat 7s ease-in-out infinite;
  }
  .panel::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.65) 46%, transparent 60%);
    transform:translateX(-130%);
    animation:shimmer 6s ease-in-out infinite;
  }
  .panel.p1{ top:118px; }
  .panel.p2{ top:212px; animation-delay:-3.2s; }
  @keyframes panelFloat{ 0%,100%{transform:translateY(-5px)} 50%{transform:translateY(5px)} }
  @keyframes shimmer{ 0%,55%{transform:translateX(-130%)} 85%,100%{transform:translateX(130%)} }
  .panel .plogo{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:17px;
    box-shadow:0 4px 12px rgba(15,23,42,.25);
  }
  .panel .ptxt strong{ display:block; font-size:20px; color:#0f172a; letter-spacing:.02em; }
  .panel .ptxt span{ font-size:12.5px; color:#64748b; letter-spacing:.05em; }

  /* ============ LAPTOP ============ */
  .laptop{ position:absolute; left:470px; top:215px; width:330px; z-index:4; }
  .screen{
    width:330px; height:200px;
    background:#0b1220;
    border:9px solid #1e293b;
    border-bottom-width:12px;
    border-radius:12px 12px 4px 4px;
    box-shadow:0 14px 34px rgba(15,23,42,.35), 0 0 44px rgba(59,130,246,.16);
    padding:8px 10px;
    position:relative; overflow:hidden;
  }
  .screen::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,.14) 0%, transparent 42%);
    pointer-events:none;
  }
  .tabbar{ display:flex; gap:6px; margin-bottom:7px; }
  .tabbar i{ width:9px; height:9px; border-radius:50%; display:block; }
  .code{ display:flex; flex-direction:column; gap:6px; }
  .code .row{ display:flex; gap:5px; align-items:center; }
  .code b{
    display:block; height:7px; border-radius:3px; font-weight:400;
  }
  .cursor-line{
    display:inline-block; width:8px; height:13px;
    background:var(--green); margin-left:3px;
    box-shadow:0 0 9px rgba(16,185,129,.9);
    animation:blink 1.05s step-end infinite;
  }
  .base{
    position:absolute; left:-25px; top:200px;
    width:380px; height:16px;
    background:linear-gradient(180deg,#334155,#1e293b);
    clip-path:polygon(6% 0, 94% 0, 100% 100%, 0 100%);
    border-radius:0 0 10px 10px;
    box-shadow:0 8px 16px rgba(15,23,42,.4);
  }
  .base::after{
    content:""; position:absolute; left:50%; top:0; width:70px; height:5px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.18); border-radius:0 0 6px 6px;
  }

  /* ============ ARDUINO ============ */
  .arduino{
    position:absolute; left:158px; top:352px; width:152px; height:78px;
    background:linear-gradient(160deg,#0aa1b4,#077f95 60%,#066a7d);
    border-radius:7px;
    box-shadow:0 12px 26px rgba(15,23,42,.35), inset 0 1px 0 rgba(255,255,255,.35);
    z-index:4;
  }
  .arduino .usb{
    position:absolute; left:-10px; top:16px; width:34px; height:26px;
    background:linear-gradient(180deg,#e2e8f0,#94a3b8);
    border-radius:4px; box-shadow:inset 0 0 0 2px #cbd5e1;
  }
  .arduino .jack{
    position:absolute; left:-9px; top:50px; width:26px; height:24px;
    background:#111827; border-radius:4px;
  }
  .arduino .chip{
    position:absolute; left:56px; top:34px; width:34px; height:26px;
    background:#0f172a; border-radius:4px;
    box-shadow:inset 0 0 0 1px #334155;
  }
  .arduino .pins{
    position:absolute; left:34px; top:-5px; width:112px; height:9px;
    background:repeating-linear-gradient(90deg,#111827 0 7px, #f8fafc 7px 12px);
    border-radius:2px;
  }
  .arduino .word{
    position:absolute; left:14px; top:58px;
    font-size:9px; font-weight:700; letter-spacing:.14em;
    color:rgba(255,255,255,.85);
  }
  .leds{ position:absolute; left:58px; top:10px; display:flex; gap:9px; }
  .leds i{
    width:9px; height:9px; border-radius:50%; display:block;
    background:#1f2937; opacity:.35;
  }
  .leds i.on-green { --c:#22c55e; }
  .leds i.on-amber { --c:#f59e0b; }
  .leds i.on-red   { --c:#ef4444; }
  .leds i{ animation:led 1.5s step-end infinite; }
  .leds i:nth-child(1){ animation-delay:0s; }
  .leds i:nth-child(2){ animation-delay:.25s; }
  .leds i:nth-child(3){ animation-delay:.5s; }
  .leds i:nth-child(4){ animation-delay:.75s; }
  .leds i:nth-child(5){ animation-delay:1s; }
  .leds i:nth-child(6){ animation-delay:1.25s; }
  @keyframes led{
    0%,25%   { background:var(--c); opacity:1; box-shadow:0 0 12px var(--c),0 0 4px var(--c); }
    26%,100% { background:#1f2937; opacity:.35; box-shadow:none; }
  }

  /* ============ TABLET — QuizNova UI ============ */
  .tablet{
    position:absolute; left:872px; top:306px; width:172px; height:124px;
    background:#0f172a; border-radius:12px;
    padding:7px;
    transform:rotate(-6deg);
    box-shadow:0 14px 30px rgba(15,23,42,.38);
    z-index:4;
  }
  .tablet .ui{
    width:100%; height:100%; border-radius:7px; overflow:hidden;
    background:linear-gradient(150deg,#eef2ff,#ffffff 45%);
    position:relative;
  }
  .ui .nav{
    height:24px; background:linear-gradient(90deg,#6366f1,#8b5cf6);
    display:flex; align-items:center; padding:0 8px; gap:6px;
  }
  .ui .nav b{ color:#fff; font-size:11.5px; letter-spacing:.04em; }
  .ui .nav .n-dot{ width:8px; height:8px; border-radius:50%; background:#a5b4fc; }
  .ui .body{ padding:7px 9px; }
  .ui .q{
    font-size:10px; font-weight:700; color:#1e293b; margin-bottom:6px;
  }
  .ui .opt{
    height:11px; border-radius:5px; background:#e2e8f0; margin-bottom:5px;
    position:relative; overflow:hidden;
  }
  .ui .opt.right{ background:#d1fae5; box-shadow:inset 0 0 0 1.5px #10b981; }
  .ui .opt.right::after{
    content:"✓"; position:absolute; right:5px; top:-4px;
    font-size:10px; color:#059669; font-weight:800;
  }
  .ui .bar{
    height:7px; border-radius:4px; background:#e2e8f0; overflow:hidden; margin-top:7px;
  }
  .ui .bar i{
    display:block; height:100%; width:72%;
    background:linear-gradient(90deg,#6366f1,#22d3ee);
    border-radius:4px;
    animation:progress 5s ease-in-out infinite alternate;
  }
  @keyframes progress{ from{width:52%} to{width:88%} }

  /* ============ ASTRONAUT ============ */
  .astro-wrap{
    position:absolute; left:566px; top:470px; width:190px; height:140px;
    z-index:5;
    animation:floaty 6.5s ease-in-out infinite;
  }
  .astro-wrap svg{ position:absolute; left:0; top:0; width:92px; height:110px; }
  .astro-wrap .flame{ animation:flicker .28s ease-in-out infinite alternate; transform-origin:center top; }
  @keyframes flicker{ from{transform:scaleY(.82); opacity:.85} to{transform:scaleY(1.15); opacity:1} }
  @keyframes floaty{
    0%,100%{ transform:translateY(-7px) rotate(-7deg); }
    50%    { transform:translateY(9px)  rotate(6deg);  }
  }
  .tag{
    position:absolute; left:84px; top:74px;
    font-family:Consolas,"Cascadia Code",monospace;
    font-size:13px; color:#0f172a;
    background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.95);
    padding:5px 10px; border-radius:9px;
    box-shadow:0 8px 20px rgba(15,23,42,.22);
    backdrop-filter:blur(8px);
    white-space:nowrap;
    transform:rotate(-4deg);
  }
  .tag em{ color:#059669; font-style:normal; font-weight:700; }

  /* ============ FINISHING LIGHT ============ */
  .vignette{
    position:absolute; inset:0; z-index:9; pointer-events:none;
    box-shadow:inset 0 0 130px rgba(15,23,42,.20);
    background:radial-gradient(120% 90% at 50% 40%, transparent 62%, rgba(15,23,42,.12));
  }

  .hint{
    color:#64748b; font-size:13px; letter-spacing:.04em;
    user-select:none;
  }
  .hint kbd{
    background:#1e293b; color:#cbd5e1; border-radius:4px;
    padding:1px 7px; font-family:inherit; border:1px solid #334155;
  }
  /* capture mode (used by headless screenshot) */
  body.capture{ gap:0; justify-content:flex-start; background:#0b1220; }
  body.capture .hint{ display:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage" title="Click to fullscreen">
  <div class="camera">

    <!-- ROOM -->
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="window"></div>
    <div class="sunbeam"></div>
    <div class="glow-blue"></div>
    <div class="glow-green"></div>

    <!-- bokeh dust -->
    <span class="dot" style="left:700px;  top:96px;  width:12px;height:12px; animation-delay:-2s"></span>
    <span class="dot" style="left:1060px; top:420px; width:9px; height:9px; animation-delay:-5s"></span>
    <span class="dot" style="left:430px;  top:470px; width:11px;height:11px; animation-delay:-8s"></span>
    <span class="dot" style="left:860px;  top:150px; width:7px; height:7px; animation-delay:-1s"></span>

    <!-- DESK -->
    <div class="desk-top"></div>
    <div class="desk-edge"></div>
    <div class="leg l"></div>
    <div class="leg r"></div>
    <div class="under-desk"></div>

    <!-- TITLE -->
    <div class="title">
      <div class="name">CHARLES</div>
      <div class="subtitle"><span class="typed" id="typed"></span><span class="caret"></span></div>
    </div>

    <!-- FLOATING TECH LOGOS -->
    <!-- HTML5 -->
    <div class="icon" style="left:92px; top:96px; animation-duration:5.6s">
      <svg viewBox="0 0 100 100">
        <path d="M9 5 h82 l-7 83 -34 11 -34 -11 Z" fill="#e34f26"/>
        <text x="50" y="66" font-size="46" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">5</text>
      </svg>
      <span class="label">HTML5</span>
    </div>
    <!-- Python -->
    <div class="icon" style="left:250px; top:188px; animation-duration:6.4s; animation-delay:-1.2s">
      <svg viewBox="0 0 100 100">
        <rect x="13" y="9"  width="46" height="56" rx="18" fill="#3776AB"/>
        <rect x="13" y="44" width="56" height="20" rx="10" fill="#3776AB"/>
        <circle cx="44" cy="24" r="5" fill="#fff"/>
        <rect x="41" y="35" width="46" height="56" rx="18" fill="#FFD43B"/>
        <rect x="31" y="35" width="56" height="20" rx="10" fill="#FFD43B"/>
        <circle cx="57" cy="76" r="5" fill="#fff"/>
      </svg>
      <span class="label">Python</span>
    </div>
    <!-- React -->
    <div class="icon" style="left:78px; top:316px; animation-duration:5s; animation-delay:-2.4s">
      <svg viewBox="0 0 100 100">
        <g fill="none" stroke="#0ea5e9" stroke-width="5">
          <ellipse cx="50" cy="50" rx="45" ry="17"/>
          <ellipse cx="50" cy="50" rx="45" ry="17" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="45" ry="17" transform="rotate(120 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="10" fill="#0ea5e9"/>
      </svg>
      <span class="label">React</span>
    </div>
    <!-- CSS3 -->
    <div class="icon" style="left:340px; top:352px; animation-duration:6s; animation-delay:-3.5s">
      <svg viewBox="0 0 100 100">
        <path d="M9 5 h82 l-7 83 -34 11 -34 -11 Z" fill="#1572b6"/>
        <text x="50" y="66" font-size="46" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">3</text>
      </svg>
      <span class="label">CSS3</span>
    </div>
    <!-- PHP -->
    <div class="icon" style="left:392px; top:254px; animation-duration:5.4s; animation-delay:-1.8s">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="50" rx="48" ry="31" fill="#777BB4"/>
        <ellipse cx="50" cy="50" rx="48" ry="31" fill="none" stroke="#4c5a91" stroke-width="2"/>
        <text x="50" y="61" font-size="31" font-weight="700" font-style="italic" fill="#fff" text-anchor="middle" font-family="Arial">php</text>
      </svg>
      <span class="label">PHP</span>
    </div>
    <!-- JavaScript -->
    <div class="icon" style="left:918px; top:64px; animation-duration:6.8s; animation-delay:-0.7s">
      <svg viewBox="0 0 100 100">
        <rect x="5" y="5" width="90" height="90" rx="16" fill="#f7df1e" stroke="#c9a800" stroke-width="2"/>
        <text x="50" y="76" font-size="48" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">JS</text>
      </svg>
      <span class="label">JavaScript</span>
    </div>
    <!-- MySQL -->
    <div class="icon" style="left:830px; top:222px; animation-duration:5.8s; animation-delay:-4.1s">
      <svg viewBox="0 0 100 100">
        <path d="M14 24 v50 a36 12 0 0 0 72 0 V24" fill="#00758F"/>
        <ellipse cx="50" cy="24" rx="36" ry="12" fill="#00a3bb"/>

<script>
  /* ---- typing subtitle ---- */
  if (location.hash.includes("capture") || new URLSearchParams(location.search).has("capture")) document.body.classList.add("capture");

  const text = "BSIT Student & Full-Stack Developer";
  const el = document.getElementById("typed");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduced) {
    el.textContent = text;
  } else {
    let i = 0, deleting = false;
    (function tick(){
      if (!deleting) {
        el.textContent = text.slice(0, ++i);
        if (i === text.length) { deleting = true; return setTimeout(tick, 2600); }
        setTimeout(tick, 55 + Math.random() * 45);
      } else {
        el.textContent = text.slice(0, --i);
        if (i === 0) { deleting = false; return setTimeout(tick, 700); }
        setTimeout(tick, 24);
      }
    })();
  }

  /* ---- fullscreen for clean recording ---- */
  const stage = document.getElementById("stage");
  stage.addEventListener("click", () => {
    if (!document.fullscreenElement) stage.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) stage.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });
</script>
